[workspace]
resolver = "3"
members = [
    "crates/ide-core",
    "crates/ide-buffer",
    "crates/ide-syntax",
    "crates/ide-lsp",
    "crates/ide-agents",
    "crates/ide-term",
    "crates/ide-git",
    "crates/andy-ide",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/uncleandyv/andy-ide"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The parsers, the rope and the GUI are all heavy in an unoptimized build: a
# keystroke used to cost tens of milliseconds at `opt-level = 0`. Dependencies
# are built optimized, our own crates lightly, so `cargo run` stays usable
# without the compile time of a full release build.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
