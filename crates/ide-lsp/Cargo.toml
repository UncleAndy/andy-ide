[package]
name = "ide-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "LSP client and language server registry"

[dependencies]
anyhow = "1"
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

# A stand-in language server for the integration tests: a real process that
# speaks the protocol, so the transport is tested, not mocked.
[[bin]]
name = "fake-lsp"
path = "tests/support/fake_lsp.rs"

[dev-dependencies]
tempfile = "3"
