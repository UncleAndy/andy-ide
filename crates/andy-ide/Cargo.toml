[package]
name = "andy-ide"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "The andy-ide application"

[dependencies]
ide-core = { path = "../ide-core" }
ide-lsp = { path = "../ide-lsp" }
lsp-types = "0.97"
ide-buffer = { path = "../ide-buffer" }
ide-syntax = { path = "../ide-syntax" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
eframe = "0.36.2"
egui = "0.36.2"
egui_dock = { version = "0.21.1", features = ["serde"] }
egui_commonmark = { version = "0.25", default-features = false }
ide-term = { version = "0.1.0", path = "../ide-term" }
vt100 = "0.18"
ide-git = { version = "0.1.0", path = "../ide-git" }
ide-agents = { version = "0.1.0", path = "../ide-agents" }
jiff = "0.2.38"

[dev-dependencies]
egui_kittest = "0.36"
tempfile = "3"
